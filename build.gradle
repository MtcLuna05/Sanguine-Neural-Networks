plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/client/').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/server/').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
sourceSets.main.resources { srcDirs 'src/generated/resources/client', 'src/generated/resources/server' }
repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.blamejared.com';
        content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
}
dependencies {
    implementation "maven.modrinth:hostile-neural-networks:${hnn_version}"
    implementation "maven.modrinth:placebo:${placebo_version}"
    implementation "maven.modrinth:neovitae:${neovitae_version}"
    implementation "maven.modrinth:geckolib:${geckolib_version}"
    runtimeOnly "maven.modrinth:modonomicon:${modonomicon_version}"
    runtimeOnly "maven.modrinth:powah:${powah_version}"
    runtimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    runtimeOnly "maven.modrinth:guideme:${guideme_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}
tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                 mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
                 neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Test fixtures are loaded only by an explicitly requested GameTest run.
if (project.hasProperty('gameTests')) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    neoForge.runs {
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}
tasks.named('jar') {
    exclude 'com/leo/sanguine_networks/gametest/**'
    exclude 'data/sanguine_networks/structure/test_*.nbt'
    exclude 'data/sanguine_networks/recipe/test_*.json'
}
